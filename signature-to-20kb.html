<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compress Signature to 20KB Online Free - PDFReady</title>
<meta name="description" content="Compress signature image to 20KB online for free. Prepare signatures for online forms and applications.">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:#fff;padding:18px 6%;font-size:22px;font-weight:700}
main{max-width:850px;margin:auto;padding:35px 16px}
.card{background:#fff;border-radius:18px;padding:25px;box-shadow:0 8px 30px #0001}
h1{text-align:center;font-size:34px}
.sub{text-align:center;color:#667085;line-height:1.6}
.drop{display:block;border:2px dashed #6366f1;border-radius:15px;padding:40px;text-align:center;margin:25px 0;cursor:pointer}
input{display:none}
button{background:#4f46e5;color:#fff;border:0;padding:13px 20px;border-radius:10px;font-weight:bold;cursor:pointer}
button:disabled{background:#aaa}
#status{margin-top:18px;line-height:1.6}
.preview{max-width:300px;max-height:180px;display:block;margin:20px auto}
a{color:#4f46e5}
</style>
</head>

<body>

<header>PDFReady — Free PDF Tools</header>

<main>
<div class="card">

<h1>Compress Signature to 20KB</h1>

<p class="sub">
Compress your signature image to approximately 20KB for online forms,
college applications, job applications and document uploads.
</p>

<label class="drop" for="signature">
<div style="font-size:45px">✍️</div>
<strong id="label">Choose signature image</strong>
<br><br>
<span>JPG, JPEG or PNG</span>
</label>

<input id="signature" type="file" accept="image/jpeg,image/png">

<img id="preview" class="preview" style="display:none">

<button id="compress" disabled>Compress to 20KB</button>

<div id="status"></div>

<p><a href="./">← Back to PDFReady</a></p>

</div>
</main>

<script>
const input=document.getElementById("signature");
const label=document.getElementById("label");
const button=document.getElementById("compress");
const status=document.getElementById("status");
const preview=document.getElementById("preview");

let file=null;

input.addEventListener("change",()=>{
file=input.files[0];

if(!file){
button.disabled=true;
return;
}

label.textContent=file.name;
button.disabled=false;

preview.src=URL.createObjectURL(file);
preview.style.display="block";
status.textContent="";
});

button.addEventListener("click",()=>{
if(!file)return;

const img=new Image();
img.onload=()=>{

let canvas=document.createElement("canvas");
let maxWidth=900;
let scale=Math.min(1,maxWidth/img.width);

canvas.width=Math.max(1,Math.round(img.width*scale));
canvas.height=Math.max(1,Math.round(img.height*scale));

let ctx=canvas.getContext("2d");
ctx.fillStyle="#ffffff";
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.drawImage(img,0,0,canvas.width,canvas.height);

let best=null;
let quality=0.9;

for(let i=0;i<35;i++){

let data=canvas.toDataURL("image/jpeg",quality);
let bytes=Math.ceil((data.length-data.indexOf(",")-1)*3/4);

if(bytes<=20*1024){
best=data;
break;
}

quality-=0.025;

if(quality<0.05)break;
}

if(!best){
status.innerHTML="⚠️ This image could not reach 20KB. Try a smaller signature image.";
return;
}

let a=document.createElement("a");
a.href=best;
a.download="signature-under-20KB.jpg";
a.click();

let size=Math.round(((best.length-best.indexOf(",")-1)*3/4)/1024);

status.innerHTML="✅ Signature compressed successfully.<br>Approximate size: <b>"+size+" KB</b>";
};

img.src=URL.createObjectURL(file);
});
</script>

</body>
</html>
