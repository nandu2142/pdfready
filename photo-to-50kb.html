<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compress Photo to 50KB Online Free - PDFReady</title>
<meta name="description" content="Compress JPG and PNG photos to 50KB online for free. Prepare photos for forms, applications and uploads.">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:#fff;padding:18px 6%;font-size:22px;font-weight:700}
main{max-width:850px;margin:auto;padding:35px 16px}
.card{background:#fff;border-radius:18px;padding:25px;box-shadow:0 8px 30px #0001}
h1{text-align:center;font-size:34px}
.sub{text-align:center;color:#667085;line-height:1.6}
.drop{display:block;border:2px dashed #6366f1;border-radius:15px;padding:40px;text-align:center;margin:25px 0;cursor:pointer}
input{display:none}
button{background:#4f46e5;color:#fff;border:0;padding:13px 20px;border-radius:10px;font-weight:bold;cursor:pointer}
button:disabled{background:#aaa}
#status{margin-top:18px;line-height:1.6}
.preview{max-width:250px;max-height:250px;display:block;margin:20px auto;border-radius:10px}
a{color:#4f46e5}
</style>
</head>
<body>

<header>PDFReady — Free PDF Tools</header>

<main>
<div class="card">

<h1>Compress Photo to 50KB</h1>

<p class="sub">
Reduce your JPG or PNG photo to approximately 50KB for online forms,
college applications, job applications and document uploads.
</p>

<label class="drop" for="photo">
<div style="font-size:45px">📷</div>
<strong id="label">Choose your photo</strong>
<br><br>
<span>JPG, JPEG or PNG</span>
</label>

<input id="photo" type="file" accept="image/jpeg,image/png">

<img id="preview" class="preview" style="display:none">

<button id="compress" disabled>Compress to 50KB</button>

<div id="status"></div>

<p><a href="./">← Back to PDFReady</a></p>

</div>
</main>

<script>
const input=document.getElementById("photo");
const label=document.getElementById("label");
const button=document.getElementById("compress");
const status=document.getElementById("status");
const preview=document.getElementById("preview");

let file=null;

input.addEventListener("change",()=>{
file=input.files[0];

if(!file){
button.disabled=true;
return;
}

label.textContent=file.name;
button.disabled=false;

const url=URL.createObjectURL(file);
preview.src=url;
preview.style.display="block";

status.textContent="";
});

button.addEventListener("click",()=>{
if(!file)return;

const img=new Image();
const url=URL.createObjectURL(file);

img.onload=()=>{
let canvas=document.createElement("canvas");
let maxWidth=1200;
let scale=Math.min(1,maxWidth/img.width);

canvas.width=Math.round(img.width*scale);
canvas.height=Math.round(img.height*scale);

let ctx=canvas.getContext("2d");
ctx.drawImage(img,0,0,canvas.width,canvas.height);

let quality=0.9;
let best=null;

for(let i=0;i<30;i++){

let data=canvas.toDataURL("image/jpeg",quality);
let bytes=Math.ceil((data.length-data.indexOf(",")-1)*3/4);

if(bytes<=50*1024){
best=data;
break;
}

quality-=0.03;

if(quality<0.1)break;
}

if(!best){
status.innerHTML="⚠️ This image cannot reach 50KB at the current dimensions. Try a smaller image.";
return;
}

const a=document.createElement("a");
a.href=best;
a.download="photo-under-50KB.jpg";
a.click();

const approx=Math.round(((best.length-best.indexOf(",")-1)*3/4)/1024);

status.innerHTML=
"✅ Photo compressed successfully.<br>"+
"Approximate size: <b>"+approx+" KB</b>";

};

img.src=url;
});
</script>

</body>
</html>
